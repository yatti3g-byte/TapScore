<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapScore</title>
<meta name="theme-color" content="#f6f5f0">
<meta name="description" content="スマホで1球ずつタップして記録する、少年野球の無料スコアブック。選手ごとのカルテが自動でできて、結果では見えない伸びをAIに相談できます。登録なし、データは端末の中だけ。">
<meta property="og:type" content="website">
<meta property="og:title" content="TapScore">
<meta property="og:description" content="スマホで1球ずつタップして記録する、少年野球の無料スコアブック。選手ごとのカルテが自動でできて、結果では見えない伸びをAIに相談できます。登録なし、データは端末の中だけ。">
<meta property="og:url" content="https://yatti3g-byte.github.io/TapScore/">
<meta property="og:image" content="https://yatti3g-byte.github.io/TapScore/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BE%3C/text%3E%3C/svg%3E">
<style>
/* Brand: same palette, type and components as the スコアブック読み取り app (warm off-white page, white cards,
   green primary, system Japanese sans). Ball/strike/out lamps keep baseball's own green/yellow/red. */
:root{
  --paper:#f6f5f0; --surface:#ffffff; --ink:#1f2a22; --muted:#6b756e; --line:#d9d8d0; --accent2:#e8f3ec; --wn:#fff4d6;
  --board:var(--surface); --board-ink:var(--ink); --board-dim:var(--muted);
  --grass:#5a9a6c; --grass-in:#6aaa7b; --dirt:#cfae7e;
  --accent:#2f7d4f; --accent-ink:#ffffff;
  --lamp-b:#2fa04e; --lamp-s:#e0b000; --lamp-o:#d8432e; --hit:#c2402d;
  --font-display:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-body:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141a16; --surface:#1e2721; --ink:#e8ede9; --muted:#98a49b; --line:#33423a; --accent2:#25382c; --wn:#3a3418;
    --grass:#2f6444; --grass-in:#38724f; --dirt:#927851;
    --accent:#58b87e; --accent-ink:#ffffff;
    --lamp-b:#3cc063; --lamp-s:#f0c21a; --lamp-o:#ef5a44; --hit:#ff7a66;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141a16; --surface:#1e2721; --ink:#e8ede9; --muted:#98a49b; --line:#33423a; --accent2:#25382c; --wn:#3a3418;
  --grass:#2f6444; --grass-in:#38724f; --dirt:#927851;
  --accent:#58b87e; --accent-ink:#ffffff;
  --lamp-b:#3cc063; --lamp-s:#f0c21a; --lamp-o:#ef5a44; --hit:#ff7a66;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#main{max-width:540px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}

.mast h1{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.2;margin:8px 0 2px;text-wrap:balance;letter-spacing:.02em}
.mast p{margin:0;color:var(--muted);font-size:14px}
.banner{border:1px solid var(--line);border-left:4px solid var(--lamp-s);background:var(--surface);padding:10px 12px;border-radius:8px;font-size:14px;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-weight:700;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;font-size:14px;align-self:center}
.link.danger{color:var(--hit)}

.games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.gcard{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gitem{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.row.sep{margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.btn.danger{color:var(--hit);border-color:var(--hit)}
.gdel{border:1px solid var(--line);background:var(--surface);color:var(--hit);border-radius:12px;padding:0 12px;font-size:13px;font-weight:700;min-width:52px}
.teamhead{font-family:var(--font-display);font-size:22px;font-weight:800;margin:18px 0 0;padding-top:12px;border-top:2px solid var(--line)}
.gcard .meta{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .teams{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:16px}
.gcard .teams span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .teams span:last-child{text-align:right}
.gcard .teams b{font-variant-numeric:tabular-nums;font-size:20px;white-space:nowrap}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid var(--line);white-space:nowrap}
.pill.live{background:var(--lamp-o);color:#fff;border-color:transparent}
.pill.done{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 0;margin:0}
.foot{font-size:13px;color:var(--muted);margin:0}
.helpl{display:block;text-align:center;font-weight:700;color:var(--accent);text-decoration:none;padding:12px;margin:4px 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.top{display:flex;align-items:center;gap:10px}
.back{background:none;border:0;padding:8px 4px;font-weight:700;white-space:nowrap}
.gset{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:1px;background:none;border:0;padding:4px 0;text-align:right;color:var(--muted)}
.gset .gmeta{font-size:13px;overflow-wrap:anywhere}
.gset .gsub{font-size:12px;display:flex;align-items:center;gap:10px}
.gbtn{background:none;border:0;padding:4px 0;font-size:12px;color:var(--muted)}
.gbtn b{color:var(--ink);font-weight:700}
.gset .gsub b{color:var(--ink);font-weight:700}
.gtitle{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.gtitle span{margin-left:8px}

.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:8px 6px;font-family:var(--font-display)}
.bscroll{overflow-x:auto}
.board table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.board th,.board td{padding:5px 0;text-align:center;min-width:19px;font-size:16px;font-weight:700}
.board thead th{font-size:12px;color:var(--board-dim);font-family:var(--font-body);font-weight:500}
.board .tname{text-align:left;padding-left:8px;white-space:nowrap;max-width:4.6em;padding-right:4px;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--board)}
.board .tot{font-size:20px;min-width:26px;font-weight:800;border-left:1px solid var(--board-dim)}
.board thead .tot{font-size:12px;font-weight:500}
.board td.now{background:var(--accent);color:var(--accent-ink);border-radius:4px}
.board tr.atbat .tname::before{content:"▶";font-size:10px;margin-right:4px;color:var(--accent)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;border-radius:7px;padding:8px 0;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.status{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.inn{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.1;white-space:nowrap}
.bso{display:flex;flex-direction:column;gap:3px;justify-self:end}
.bso div{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.bso span{width:1em}
.lamp{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.lamp.b.on{background:var(--lamp-b);border-color:var(--lamp-b)}
.lamp.s.on{background:var(--lamp-s);border-color:var(--lamp-s)}
.lamp.o.on{background:var(--lamp-o);border-color:var(--lamp-o)}
.duel{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.duel small{color:var(--muted);margin-right:6px}
.duel small.ni{margin:0 0 0 2px}
.duel b{font-variant-numeric:tabular-nums}

.field{width:100%;height:auto;display:block;border-radius:14px;user-select:none;-webkit-user-select:none}
.field.placing{touch-action:none;outline:3px solid var(--accent)}
.f-out{fill:var(--grass)} .f-fair{fill:var(--grass-in)} .f-in{fill:var(--grass-in)}
.f-dirt{fill:var(--dirt);stroke:var(--dirt);stroke-width:30;stroke-linejoin:round}
.f-line{stroke:#fff;stroke-width:1.5;fill:none;opacity:.8}
.f-mound{fill:var(--dirt)} .f-base{fill:#fff}
.tok text{font-family:var(--font-body);font-weight:700;font-size:12px;text-anchor:middle;pointer-events:none}
.tok.fld circle{fill:#fff;stroke:#14251d;stroke-width:1.5} .tok.fld text{fill:#14251d}
.tok.run{touch-action:none;cursor:grab}
.tok.run circle{fill:var(--accent);stroke:#2a2104;stroke-width:1.5} .tok.run text{fill:#2a2104}
.tok.bat circle{fill:#14251d;stroke:#fff;stroke-width:1.5} .tok.bat text{fill:#fff}
.placing .tok.fld{cursor:grab}
.placing .tok.fld circle{stroke:var(--accent);stroke-width:3}
.dot{stroke-width:1.5} .dot.hit{fill:var(--hit);stroke:#fff} .dot.out{fill:none;stroke:#fff}

.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad .btn{padding:10px 4px;min-height:54px}
.pad .k-b{border-bottom:4px solid var(--lamp-b)}
.pad .k-s{border-bottom:4px solid var(--lamp-s)}
.pad .bip{min-height:58px;font-size:18px}
.pad .span2{grid-column:span 2}
.hint{font-size:13px;color:var(--muted);margin:0}
.place{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.place p{margin:0;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:40px;font-weight:500}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chip:disabled{opacity:.4}
.chip.out{color:var(--hit)}.chip.out.on{background:#fde8e4;border-color:var(--hit);color:var(--hit);box-shadow:inset 0 0 0 1px var(--hit)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-weight:700;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
h2{font-family:var(--font-display);font-size:17px;margin:8px 0 0;font-weight:800}
.result{background:var(--board);color:var(--board-ink);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--font-display);font-weight:700;font-size:17px}
.tscroll.dark{background:var(--board);color:var(--board-ink);border-color:transparent;border-radius:12px}
.dark .stats td{font-family:var(--font-display);font-weight:700;font-size:15px}
.dark .stats td:first-child{font-family:var(--font-body);font-weight:500}
.dark .stats thead th{color:var(--board-dim)}
.dark .stats th,.dark .stats td{border-bottom:1px solid rgba(244,241,226,.14)}
.dark .stats th:first-child,.dark .stats td:first-child{background:var(--board)}
.dark .stats tr.total td{border-top:2px solid var(--board-dim);color:var(--accent)}
.dark .stats td.key{color:var(--accent)}
.dark .mark,.result .mark{background:var(--accent);color:var(--accent-ink)}
.imgwrap{max-height:52vh;overflow:auto;border-radius:10px;border:1px solid var(--line)}
.imgwrap img{display:block;width:100%;height:auto}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stats{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.stats th,.stats td{padding:8px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats thead th{font-size:12px;color:var(--muted);font-weight:500}
.stats tr:last-child td{border-bottom:0}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log .half{font-family:var(--font-display);font-weight:800;font-size:17px;margin-top:8px}
.log .pa,.log .ev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:15px}
.log .ev{font-size:14px;color:var(--muted)}
.log button{width:100%;text-align:left;font:inherit;color:inherit}
.log button.ev{color:var(--muted)}
.status .mark{background:var(--accent);color:var(--accent-ink)}
.mark{display:inline-block;min-width:1.5em;text-align:center;font-weight:700;border-radius:4px;background:var(--ink);color:var(--paper);font-size:12px;padding:1px 4px;margin-right:6px}
.stats th:first-child,.stats td:first-child{position:sticky;left:0;background:var(--surface)}
.stats tr.total td{font-weight:700;border-top:2px solid var(--line)}
.stats td.key{font-weight:700}
.log .what{font-weight:700}
.log .mv{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.log .hit .what{color:var(--hit)}
.log .seq{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.pt{font-style:normal;font-size:11px;font-weight:700;line-height:1;padding:4px 7px;border-radius:99px;white-space:nowrap}
.pt.b{background:var(--lamp-b);color:#fff}.pt.s{background:var(--lamp-s);color:#2a2104}.pt.x{background:var(--ink);color:var(--paper)}.pt.d{background:var(--lamp-o);color:#fff}
.log .plus{font-weight:700;color:var(--hit);white-space:nowrap}

.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px;color:var(--ink);font-size:13px;font-family:ui-monospace,monospace;word-break:break-all;resize:none;width:100%}
.fld input,.lu input,.lu select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;min-height:44px;color:var(--ink);font-size:16px;min-width:0}
.lu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lu li,.luhead{display:grid;grid-template-columns:24px 52px 1fr 92px;gap:6px;align-items:center}
.luhead{font-size:12px;color:var(--muted);margin-bottom:-4px}
.lu input[data-lu="no"]{text-align:center;padding:10px 4px}
.sqchip{display:inline-flex;align-items:center;gap:6px}.sqdel{border:0;background:none;color:var(--muted);font-size:13px;padding:0 2px;cursor:pointer}
.sqadd input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.dupnote{background:var(--wn);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}.dupnote .btn{margin-top:8px;width:100%}
.rtab tr.gone input{color:var(--muted);background:var(--paper)}
.rtab .lt{display:block;font-size:11px;color:var(--muted);font-weight:700}
.rleave{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.lu input.dup{border-color:var(--hit);background:#fdecea}
h4.lh{margin:0;font-size:13px;color:var(--muted)}
.rtab input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;min-height:40px;color:var(--ink);font-size:16px}
.rtab td{padding:4px}.rtab td:first-child{width:64px}.rtab td:last-child{width:40px}
.rtab th:first-child,.rtab td:first-child{position:static}
.clubbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.clubbox .fld input,.clubbox textarea{background:var(--paper)}
.rdel{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;min-height:40px;color:var(--hit)}
textarea{font:inherit}
.fld textarea[data-rs]{font-family:var(--font-body);font-size:16px;background:var(--surface);word-break:normal;resize:vertical}
.lu .ord{font-family:var(--font-display);font-weight:800;font-size:18px;text-align:center}
.lu .ro{padding:8px 0}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,16,12,.55)}
#sheet[hidden]{display:none}
.panel{background:var(--surface);color:var(--ink);width:100%;max-width:540px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 20px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-family:var(--font-display);font-size:20px}
.panel h4{margin:0;font-size:13px;color:var(--muted);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3 .btn,.grid4 .btn{padding:10px 2px}
.btn.hitb{border-bottom:4px solid var(--hit)}
.warn{color:var(--hit);font-size:14px;margin:0;font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}

/* result view: same visual language as the scorebook-reader app */
.rv{--sf:var(--surface);--tx:var(--ink);--mu:var(--muted);--bd:var(--line);--ac2:var(--paper);--b0:#cdd9f1;--b1:#d6ebd0;display:flex;flex-direction:column;gap:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rv{--b0:#2c3a58;--b1:#2b4430}}
:root[data-theme="dark"] .rv{--b0:#2c3a58;--b1:#2b4430}
.rv .card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.rv .card.tb{padding:10px 8px}
.rv h2{font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1.5;margin:8px 0 0;color:var(--tx)}
.rv .sb{font-size:12px}.rv .sb th,.rv .sb td{padding:4px 4px}
.rv .mu{color:var(--mu);font-size:13px;margin:6px 0 0}
.rv .rs{font-weight:700;margin:8px 0 0}
.rv ul{margin:0;padding-left:20px;font-size:14px}
.rv .sc{overflow-x:auto}
.rv table{border-collapse:collapse;width:100%;font-size:13px}
.rv th,.rv td{border:1px solid var(--bd);padding:4px 7px;text-align:center;white-space:nowrap}
.rv th{background:var(--ac2)}.rv td.l{text-align:left}
.rv .tot,.rv tr.total td{font-weight:700}
.rv .pt th,.rv .pt td{padding:3px 4px;font-size:11px}.rv .pt td:first-child{text-align:left;padding-left:4px}
.rv .pwfit{overflow:hidden}
.rv .pw{width:max-content;min-width:0;transform-origin:0 0}
.rv .pwrow{display:flex;border-bottom:1px solid var(--bd)}
.rv .pwl{width:124px;flex:none;display:flex;align-items:center;gap:3px;padding:3px 4px 3px 0}
.rv .pwl.sub{padding-left:8px}

/* ---- brand alignment with スコアブック読み取り ---- */

/* ---------- はじめての人向けツアー（画面の見方） ---------- */

.tourcard{background:var(--accent2);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;margin:0 0 14px}

/* ---------- 選手カルテ ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 14px}
.pcard{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;color:var(--ink);min-height:64px}
.pcard .no{grid-row:1/3;display:grid;place-items:center;min-width:38px;height:38px;border-radius:10px;background:var(--accent2);color:var(--accent);font-weight:800;font-size:17px}

.pcard.gone{opacity:.7}.pcard.gone .no{background:var(--paper);color:var(--muted)}
.top .gtitle{flex:1;min-width:0;text-align:right;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead{display:flex;gap:12px;align-items:center;margin:10px 0 12px}

.goal{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 10px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.tile b{display:block;font-size:18px}.tile small{color:var(--muted);font-size:12px}
.krows td{white-space:nowrap}.krows td.res{white-space:normal;min-width:120px;font-size:13px}
.krows tr.click{cursor:pointer}.krows tr.click:active{background:var(--accent2)}
.wl{font-size:12px}.wl.W{color:var(--accent)}.wl.L{color:var(--hit)}
.kprompt{background:var(--wn,#fff4d6);border-radius:12px;padding:12px 14px;margin:0 0 12px}.kprompt p{margin:4px 0 8px;font-size:14px}
.review{list-style:none;margin:0;padding:0}.review li{display:grid;grid-template-columns:7.5em 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.review li:last-child{border-bottom:0}.review .rv-n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.review .rv-s small{display:block;color:var(--muted);font-size:12px}

.tours{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tourbtn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);display:block}
.tourbtn b{display:flex;justify-content:space-between;align-items:center;font-size:16px}.tourbtn small{display:block;color:var(--muted);font-size:13px;margin-top:2px}

<body>
<main id="main"></main>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*ENGINE-START*/
const POS=['','投','捕','一','二','三','遊','左','中','右','指'];
const WHY={reg:'',time:'時間切れ',cold:'コールド',rain:'降雨',other:'打ち切り'};
function endLabel(S){return S.ended?'試合終了'+(WHY[S.endWhy]?'（'+WHY[S.endWhy]+'）':''):'';}
const RES={
  '1B':{l:'単打',hit:1,ab:1,tb:1},'2B':{l:'二塁打',hit:1,ab:1,tb:2},'3B':{l:'三塁打',hit:1,ab:1,tb:3},'HR':{l:'本塁打',hit:1,ab:1,tb:4},
  GO:{l:'ゴロ',ab:1},FO:{l:'フライ',ab:1},LO:{l:'ライナー',ab:1},DP:{l:'併殺打',ab:1},
  SAC:{l:'犠打',ab:0},SF:{l:'犠牲フライ',ab:0},E:{l:'失策',ab:1},FC:{l:'野選',ab:1}
};
const PL={'1B':'安','2B':'2','3B':'3',HR:'本',GO:'ゴ',FO:'飛',LO:'直',DP:'併',SAC:'犠',SF:'犠飛',E:'失',FC:'野選'};
const NL={'1B':'安打','2B':'二塁打','3B':'三塁打',HR:'本塁打',GO:'ゴロ',FO:'飛球',LO:'直',DP:'併殺',SAC:'犠打',SF:'犠飛',E:'失策',FC:'野選'};
const RUNK={SB:'盗塁',WP:'暴投',PB:'捕逸',BK:'ボーク',ADV:'進塁',CS:'盗塁死',PO:'走塁死・けん制死'};
const FP={1:[150,192],2:[150,268],3:[232,158],4:[194,126],5:[68,158],6:[106,126],7:[60,84],8:[150,54],9:[240,84]};
const BP={1:[212,184],2:[150,122],3:[88,184],4:[150,246]};
const POSK=['','ピッチャー','キャッチャー','ファースト','セカンド','サード','ショート','レフト','センター','ライト'];
// Play text as Japanese baseball coverage writes it: direction first, then the result, no brackets.
// Data stays as codes (result + fielder number); only this function decides the wording.
function resText(res,f){
  const k=POSK[f]||'',inf=f>=1&&f<=6;
  switch(res){
    case '1B':return !k?'ヒット':inf?k+'への内野安打':k+'前ヒット';
    case '2B':return k?k+'への二塁打':'二塁打';
    case '3B':return k?k+'への三塁打':'三塁打';
    case 'HR':return k?k+'への本塁打':'本塁打';
    case 'GO':return k+'ゴロ';
    case 'FO':return k+'フライ';
    case 'LO':return k+'ライナー';
    case 'DP':return k?k+'ゴロ併殺打':'併殺打';
    case 'SAC':return k?k+'への送りバント（犠打）':'送りバント（犠打）';
    case 'SF':return k?k+'への犠牲フライ':'犠牲フライ';
    case 'E':return k?k+'のエラーで出塁':'エラーで出塁';
    case 'FC':return k?k+'ゴロ野選':'野選';

  return (RES[res]||RES.GO).l;
}
function defaultLineup(){return [8,6,4,3,5,7,9,2,1].map(p=>({n:'',p}));}
function pname(pl,i){return (pl&&pl.n)?pl.n:'名前不明（'+(i+1)+'番）';}
const shortName=n=>String(n==null?'':n).replace(/^名前不明（\d+番）$/,'名前不明');
function defaults(res,bases){
  const r={};const occ=[1,2,3].filter(k=>bases[k]);const forced={};
  for(let k=1;k<=3;k++){if(bases[k])forced[k]=true;else break;}
  const all=n=>occ.forEach(k=>{r[k]=Math.min(4,k+n);});
  const stay=()=>occ.forEach(k=>{r[k]=k;});
  const forcedAdv=()=>occ.forEach(k=>{r[k]=forced[k]?k+1:k;});
  let b=0;
  switch(res){
    case '1B':b=1;all(1);break;
    case '2B':b=2;all(2);break;
    case '3B':b=3;all(3);break;
    case 'HR':b=4;all(3);break;
    case 'SAC':b=0;all(1);break;
    case 'SF':b=0;stay();if(bases[3])r[3]=4;break;
    case 'E':b=1;forcedAdv();break;
    case 'FC':{b=1;forcedAdv();const fk=occ.filter(k=>forced[k]);const t=fk.length?fk[fk.length-1]:occ[occ.length-1];if(t)r[t]=0;break;}
    case 'DP':{b=0;forcedAdv();const t=bases[1]?1:occ[occ.length-1];if(t)r[t]=0;break;}
    case 'GO':b=0;forcedAdv();break;

function destConflict(b,r){

}
function replay(g){

  const initPit=t=>{const i=lu[t].findIndex(p=>p.p===1);return i>=0?pname(lu[t][i],i):(String((g.sp&&g.sp[t])||'').trim()||'先発投手');};
  const S={inn:1,half:0,outs:0,errs:0,b:0,s:0,bases:[null,null,null,null],bat:[0,0],line:[[0],[]],R:[0,0],H:[0,0],E:[0,0],
    lu,teams,act:0,lob:[0,0],how:[{},{}],adv:[{},{}],pitFix:[false,false],pit:[initPit(0),initPit(1)],ppid:[0,1].map(t=>{const i=lu[t].findIndex(p=>p.p===1);return i>=0?lu[t][i].pid:'';}),bst:[new Map(),new Map()],pst:[new Map(),new Map()],log:[],spray:[[],[]],ended:false,seq:[],dec:null,win:-1};
  // ph[t]['打順|名前'] = その選手が就いた守備位置の順（0＝代打、-1＝代走）。表記は読み取りアプリと同じ「打左」「左投」
  S.ph=[{},{}];lu.forEach((L,t)=>L.forEach((p,i)=>{S.ph[t][i+'|'+pname(p,i)]=p.p?[p.p]:[];}));
  const posTo=(t,i)=>{const L=S.lu[t];if(!L||!L[i])return;const k=i+'|'+pname(L[i],i),a=S.ph[t][k]||(S.ph[t][k]=[]);let v=L[i].p|0;
    if(v===0){if(a.length)return;if(S.half===t&&[1,2,3].some(b=>S.bases[b]&&S.bases[b].i===i))v=-1;}
    if(a[a.length-1]!==v)a.push(v);};
  let ci=0,wp=null,lp=null;
  const bt=()=>S.half,ft=()=>1-S.half;
  const cur=()=>{const t=bt();const i=S.bat[t]%S.lu[t].length;return {i,n:pname(S.lu[t][i],i)};};
  const bs=(t,i)=>{const n=pname(S.lu[t][i],i);const k=i+'|'+n;let r=S.bst[t].get(k);
    if(!r){r={i,n,pid:S.lu[t][i]?S.lu[t][i].pid||'':'',pos:S.lu[t][i]?S.lu[t][i].p:0,seq:S.bst[t].size,pas:[],gdp:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,tb:0,rbi:0,r:0,bb:0,hbp:0,k:0,sh:0,sf:0,sb:0,cs:0,rab:0,rh:0};S.bst[t].set(k,r);}return r;};
  // One row per pitcher, created at his first pitch. lead/on describe the situation he entered in (for save/hold).
  const ps=()=>{const t=ft();const n=S.pit[t];let r=S.pst[t].get(n);
    if(!r){r={n,pid:S.ppid[t]||'',byInn:{},ra:0,raEnt:0,out:false,leave:null,kill:false,np:0,bf:0,outs:0,h:0,bb:0,hbp:0,k:0,r:0,er:0,i0:S.inn,i1:S.inn,lead:S.R[t]-S.R[1-t],on:[1,2,3].filter(k=>S.bases[k]).length,starter:S.pst[t].size===0,lost:false};S.pst[t].set(n,r);}r.i1=S.inn;return r;};
  const leaveMound=t=>{const r=S.pst[t].get(S.pit[t]);if(r){r.out=true;r.leave=S.R[t]-S.R[1-t];}};
  const pitch=pr=>{S.hasPitch=true;pr.np++;pr.byInn[S.inn]=(pr.byInn[S.inn]||0)+1;};
  const entry=o=>{S.log.push(Object.assign({ei:ci,inn:S.inn,half:S.half,sc:S.R[0]+'-'+S.R[1]},o));};
  // 打席の場面（結果が出る直前のアウト数・走者）と、打者の選手ID
  const snap=i=>{const t=bt(),p=S.lu[t][i];return {pid:(p&&p.pid)||'',o:S.outs,on:[1,2,3].filter(k=>S.bases[k]).join('')};};
  // Runs are charged to the pitcher who put the runner on. Earned unless: runner reached on an error, the play is an
  // error or passed ball (noER), or errors+outs already reached three in this half inning.
  const score=(rs,noER)=>{if(!rs.length)return;const t=bt(),f=ft(),now=ps();const clean=!noER&&(S.outs+S.errs<3);
    rs.forEach(rn=>{const before=S.R[t]-S.R[f];S.R[t]++;const hw=(rn.pa&&rn.pa.type)||'other';S.how[t][hw]=(S.how[t][hw]||0)+1;S.line[t][S.inn-1]=(S.line[t][S.inn-1]||0)+1;
      const row=S.pst[f].get(rn.pr)||now;row.r++;if(clean&&rn.er!==false)row.er++;bs(t,rn.i).r++;if(rn.pa)rn.pa.run=true;
      now.ra++;if(S.inn===now.i0)now.raEnt++;

      if(before===0){wp=[t,S.pit[t]];lp=[f,row.n];}else if(before===-1){wp=null;lp=null;}});
    if(S.R[f]-S.R[t]<=0)now.lost=true;};
  const addOut=n=>{n=Math.min(n,3-S.outs);if(n<=0)return;S.outs+=n;ps().outs+=n;};
  const endPA=()=>{const t=bt();S.bat[t]=(S.bat[t]+1)%S.lu[t].length;S.b=0;S.s=0;S.seq=[];};
  const checkHalf=()=>{if(S.outs<3)return;S.lob[S.half]+=[1,2,3].filter(k=>S.bases[k]).length;S.outs=0;S.errs=0;S.act=0;S.b=0;S.s=0;S.seq=[];S.bases=[null,null,null,null];
    if(S.half===0)S.half=1;else{S.half=0;S.inn++;}

    st.pas.push({inn:S.inn,type:'strikeout',lbl:'三振',rbi:0,run:false});entry(Object.assign({k:'pa',i:c.i,who:c.n,text,seq:S.seq.slice(),runs:0,pit:pr.n},sn));addOut(1);endPA();checkHalf();};
  // 振り逃げ：打者と投手に三振を付け、打者は一塁へ（押し出された走者だけ進む）
  const dropped3=()=>{const t=bt(),c=cur(),st=bs(t,c.i),pr=ps(),sn=snap(c.i);st.pa++;st.ab++;st.k++;if(S.bases[2]||S.bases[3])st.rab++;pr.k++;pr.bf++;
    const pa={inn:S.inn,type:'strikeout',lbl:'振逃',rbi:0,run:false};st.pas.push(pa);
    let carry={i:c.i,pr:pr.n,er:true,pa};const sc=[];for(let k=1;k<=3&&carry;k++){const o=S.bases[k];S.bases[k]=carry;carry=o;}
    if(carry)sc.push(carry);score(sc);entry(Object.assign({k:'pa',i:c.i,who:c.n,text:'振り逃げ（一塁へ）',seq:S.seq.slice(),runs:sc.length,pit:pr.n},sn));endPA();};
  const walk=label=>{const t=bt(),c=cur(),st=bs(t,c.i),pr=ps(),sn=snap(c.i);st.pa++;if(label==='死球'){st.hbp++;pr.hbp++;}else{st.bb++;pr.bb++;}pr.bf++;
    const pa={inn:S.inn,type:label==='死球'?'hbp':'walk',lbl:label,rbi:0,run:false};st.pas.push(pa);
    let carry={i:c.i,pr:pr.n,er:true,pa};const sc=[];

    if(carry)sc.push(carry);st.rbi+=sc.length;pa.rbi=sc.length;score(sc);
    entry(Object.assign({k:'pa',i:c.i,who:c.n,text:label,seq:S.seq.slice(),runs:sc.length,rbi:sc.length,pit:pr.n},sn));endPA();};

    switch(e.t){
      case 'p':{
        pitch(ps());S.seq.push(e.k);
        if(e.k==='B'){S.b++;if(S.b>=4)walk('四球');}
        else if(e.k==='F'){if(S.s<2)S.s++;}
        else{S.s++;if(S.s>=3)strikeout(e.k==='C'?'見逃し三振':'空振り三振');}
        break;}
      case 'pa':
        // 打席の結果だけを入れる簡易入力（投球数は数えない）

        if(e.k==='BB')walk('四球');else if(e.k==='HBP')walk('死球');else strikeout(e.k==='KL'?'見逃し三振':e.k==='KS'?'空振り三振':'三振');
        break;
      case 'hbp':pitch(ps());S.seq.push('D');walk('死球');break;
      case 'bip':{
        const t=bt(),c=cur(),st=bs(t,c.i),R=RES[e.res]||RES.GO,pr=ps(),risp=!!(S.bases[2]||S.bases[3]),sn=snap(c.i);if(!e.q){pitch(pr);S.seq.push('X');}pr.bf++;
        const nb=[null,null,null,null];let outs=0;const sc=[];

        const pa={inn:S.inn,type:R.hit?'hit':(e.res==='SAC'||e.res==='SF')?'sac':e.res==='E'?'error':e.res==='FC'?'fc':'out',
          lbl:e.res==='FC'?'野選':POS[e.f]?POS[e.f]+PL[e.res]:NL[e.res],hr:e.res==='HR',rbi:0,run:false};st.pas.push(pa);
        const me={i:c.i,pr:pr.n,er:e.res!=='E',pa};
        const d=e.b|0;if(d===0)outs++;else if(d>=4)sc.push(me);else nb[d]=me;
        // 3アウト目が、打者走者が一塁に着く前のアウトか、フォースアウト（ゴロ・併殺・野選・犠打）なら、そのプレーの得点は認めない（規則5.08(a)）。

        let lost=0;if(S.outs+outs>=3&&sc.length&&(['GO','DP','FC','SAC'].indexOf(e.res)>=0||(d===0&&!R.hit&&['FO','LO','SF'].indexOf(e.res)<0))){lost=sc.length;sc.length=0;}

        if(e.res==='SAC')st.sh++;if(e.res==='SF')st.sf++;if(e.res==='DP')st.gdp++;

          mv.push(RB[k]+'走者 '+shortName(pname(S.lu[t][rn.i],rn.i))+(dd===0?'はアウト':dd>=4?'は生還':'は'+RB[dd]+'へ'));}

      case 'run':{

        if(e.to===0){S.bases[e.from]=null;if(e.k==='CS')bs(t,rn.i).cs++;entry({k:'run',who,text:lab+'（'+e.from+'塁走者アウト）',runs:0});addOut(1);checkHalf();}
        else if(e.to>=4){S.bases[e.from]=null;if(e.k==='SB')bs(t,rn.i).sb++;score([rn],e.k==='PB');entry({k:'run',who,text:lab+'で生還',runs:1});}
        else{if(S.bases[e.to]||e.to<=e.from)break;S.bases[e.to]=rn;S.bases[e.from]=null;if(e.k==='SB')bs(t,rn.i).sb++;
          entry({k:'run',who,text:lab+'で'+e.to+'塁へ',runs:0});}
        break;}
      case 'sub':{
        const L=S.lu[e.tm];if(!L||!L[e.i])break;const old=pname(L[e.i],e.i);
        L[e.i]={n:String(e.n||''),p:e.p|0,no:String(e.no||''),pid:String(e.pid||'')};const nw=pname(L[e.i],e.i);posTo(e.tm,e.i);
        const pi=L.findIndex(p=>p.p===1);if(pi>=0&&!S.pitFix[e.tm]){const nn=pname(L[pi],pi);if(nn!==S.pit[e.tm]){leaveMound(e.tm);S.pit[e.tm]=nn;S.ppid[e.tm]=L[pi].pid||'';}}
        entry({k:'sub',text:teams[e.tm]+' '+(e.i+1)+'番：'+(old===nw?nw:old+' → '+nw)+'（'+(POS[e.p|0]||'守備なし')+'）'});
        break;}

async function pack(obj){
  let bytes=new TextEncoder().encode(JSON.stringify(obj)),tag='j';
  if(window.CompressionStream){try{
    const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    bytes=new Uint8Array(await new Response(cs).arrayBuffer());tag='z';}catch(e){}}
  let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);
  return tag+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpack(str){
  const tag=str[0];let b=str.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  const bin=atob(b);let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(tag==='z'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes=new Uint8Array(await new Response(ds).arrayBuffer());}
  return JSON.parse(new TextDecoder().decode(bytes));
}

// 同じ試合の2つの記録を比べる：same（同じ）／newer（受け取った方が続き）／older（手元の方が続き）／fork（別々に進んだ）

  // lineups: one slot per batting order; the first row of an order is the starter, later rows are substitutes
  const slots=[0,1].map(t=>{const T=P.side[t],max=T.rows.reduce((a,r)=>Math.max(a,r.order),0)||9,out=Array.from({length:max},()=>[]);

  const q=[0,1].map(t=>slots[t].map((rs,s)=>{const L=[];rs.forEach((r,ri)=>r.pas.forEach(p=>{
      if(p.kind==='ro'){for(let k=L.length-1;k>=0;k--)if(L[k].inn===p.inn){L[k].run=true;break;}return;}
      L.push(Object.assign({slot:s,ri,name:r.name},p));}));return L;}));

  const bat=[0,0],curRow=[slots[0].map(()=>0),slots[1].map(()=>0)],names=[lu[0].map(p=>p.n),lu[1].map(p=>p.n)];
  const memoParts=String(P.meta||'').split('／').map(x=>x.trim()).filter(x=>x&&!/^\d{4}\D+\d{1,2}\D+\d{1,2}\D*$/.test(x)&&!/^時間[:：]/.test(x));
  const g={mode:'pa',name:memoParts.join('　').slice(0,30),date:today(),inn:N,teams:[P.side[0].name,P.side[1].name],lu,ev,created:Date.now(),upd:Date.now(),imported:true};
  const dm=/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(P.meta||'');if(dm)g.date=dm[1]+'-'+('0'+dm[2]).slice(-2)+'-'+('0'+dm[3]).slice(-2);

    const t=h.t,f=1-t,len=lu[t].length;

    // batting order inside the inning: continue from the next batter, cycling
    const rem=q[t].map(L=>L.filter(p=>p.inn===h.i)),list=[];let cur=bat[t]%len,left=rem.reduce((a,L)=>a+L.length,0);
    while(left>0){let s=cur,n=0;while(!rem[s].length&&n<len){s=(s+1)%len;n++;}list.push(rem[s].shift());left--;cur=(s+1)%len;}
    let bases=[null,null,null,null],outs=0;
    const flush=()=>{[3,2,1].forEach(k=>{const r=bases[k];if(r&&r.run){ev.push({t:'run',k:'ADV',from:k,to:4});bases[k]=null;}});};
    list.forEach((p,j)=>{
      const more=list.length-1-j;
      if(curRow[t][p.slot]!==p.ri){curRow[t][p.slot]=p.ri;const r=slots[t][p.slot][p.ri];names[t][p.slot]=r.name;ev.push({t:'sub',tm:t,i:p.slot,n:r.name,p:posOf(r.pos)===1?0:posOf(r.pos)});}
      if(bat[t]%len!==p.slot)ev.push({t:'bat',tm:t,i:p.slot});bat[t]=p.slot+1;

      if(pred&&outs+pred>=3&&more>0){warn.push(hn(h)+'：アウトが3つを超えるため、'+p.name+'の「'+p.lbl+'」を失策での出塁として入れました');kind='bip';res='E';d=defaults('E',bases);pred=0;}

  });
  ev.push({t:'end'});
  const S=replay(g);
  [0,1].forEach(t=>{if(!P.sb[t])return;P.sb[t].forEach((c,i)=>{if(!/^\d+$/.test(c))return;const got=S.line[t][i]||0;
    if(+c!==got)warn.push((i+1)+'回'+(t?'裏':'表')+'：得点が合いません（読み取り '+c+'点／取り込み後 '+got+'点）');});});

  return {g,warn};
}
function importReaderFile(file){
  if(!file)return;
  if(file.size>4e6){toast('ファイルが大きすぎます');return;}
  const fr=new FileReader();
  fr.onerror=()=>toast('ファイルを読めませんでした');
  fr.onload=()=>{
    const text=String(fr.result||'');
    if(/id="tapscore-game"/.test(text)){
      let d=null;try{const el=new DOMParser().parseFromString(text,'text/html').getElementById('tapscore-game');d=JSON.parse(el.textContent);}catch(e){}
      if(!d||d.app!=='TapScore'||!receiveGame(d))toast('TapScoreのHTMLですが、内容を読み取れませんでした');
      return;
    }
    let out;try{out=readerToGame(parseReaderHTML(text));}
    catch(e){toast('TapScoreで保存したHTMLを選んでください');return;}
    const id=newId();games[id]=out.g;ui.gid=id;ui.tab='log';ui.redo=[];ui.luDraft=null;ui.mode='idle';save(id);
    ui.impWarn=out.warn;render();openSheet('imp');window.scrollTo(0,0);
  };
  fr.readAsText(file);
}
/* ---------- 自チームの名簿 ----------

   （id以外はスコアブック読み取りアプリの名簿と同じ形）。CLUBS はその配列。 */
const RKEY='scorebook-roster-v2',CKEY='tapscore-clubs-v1';
// 複数のクラブを持てる。1クラブ分は読み取りアプリの名簿と同じ形（＋id）なので、CSVの書き出し・読み込みはクラブ単位で互換。
let CLUBS=[];
const digits=v=>String(v==null?'':v).replace(/\D/g,'');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function normRoster(d){
  if(!d||typeof d!=='object')return null;

  return {clubName:String(d.clubName||d.teamName||''),aliases:(Array.isArray(d.aliases)?d.aliases:[]).map(String).filter(Boolean),
    opponents:(Array.isArray(d.opponents)?d.opponents:[]).map(x=>String(x).trim()).filter(Boolean),
    squads:(Array.isArray(d.squads)?d.squads:[]).map(x=>String(x).trim()).filter(Boolean),numAt:+d.numAt||0,
    oldTeams:(d.oldTeams&&typeof d.oldTeams==='object')?Object.assign({},d.oldTeams):{},pidAlias:(d.pidAlias&&typeof d.pidAlias==='object')?Object.assign({},d.pidAlias):{},

      left:!!(p&&p.left),goal:String((p&&p.goal)||''),gupd:+(p&&p.gupd)||0,sq:String((p&&p.sq)||''),
      goalLog:(Array.isArray(p&&p.goalLog)?p.goalLog:[]).filter(x=>x&&x.text).map(x=>({text:String(x.text).slice(0,200),from:+x.from||0,to:+x.to||0}))}))}))};
}
function rosterOut(R){
  // 人数・チーム数で黙って切り捨てない。選手の id・退団・今の課題も残す
  return {clubName:String(R.clubName||'').trim(),aliases:(R.aliases||[]).map(x=>String(x).trim()).filter(Boolean),opponents:(R.opponents||[]).map(x=>String(x).trim()).filter(Boolean),
    squads:(R.squads||[]).map(x=>String(x).trim()).filter(Boolean),numAt:+R.numAt||0,oldTeams:Object.assign({},R.oldTeams||{}),pidAlias:Object.assign({},R.pidAlias||{}),
    teams:R.teams.map(t=>({id:t.id,name:String(t.name||'').trim(),players:t.players.map(p=>{const o={id:String(p.id||''),number:digits(p.number),name:String(p.name||'').trim(),nick:String(p.nick||'').trim()};
      if(p.left)o.left=true;if(p.sq)o.sq=String(p.sq);if(p.goal){o.goal=String(p.goal);o.gupd=+p.gupd||0;}if(p.goalLog&&p.goalLog.length)o.goalLog=p.goalLog.map(x=>({text:x.text,from:x.from,to:x.to}));return o;}).filter(p=>p.name)})),updatedAt:Date.now()};
}
function normClub(d,id){const r=normRoster(d);if(!r)return null;r.id=String((d&&d.id)||id||uid('c'));if(d&&d.sample)r.sample=true;return poolify(r);}
// 選手はクラブで1つにまとめ、A・B・C…のチームは「試合の区分」にする。以前の形（クラブの中に複数チーム）の名簿はここで1つにまとめる。
// 試合の記録は書きかえず、前のチームのIDは oldTeams（→区分の名前）、まとめた選手のIDは pidAlias（→残したID）で読みかえる。
function poolify(c){
  const T=c.teams||[];
  T.forEach(t=>{const n=String(t.name||'').trim();if(n&&c.squads.indexOf(n)<0)c.squads.push(n);});
  if(T.length===1&&!String(T[0].name||'').trim())return c;
  const pool={id:uid('t'),name:'',players:[]};
  if(!T.length){c.teams=[pool];return c;}
  T.forEach(t=>{const sq=String(t.name||'').trim();c.oldTeams[t.id]=sq;
    t.players.forEach(p=>{const q=Object.assign({},p);if(!q.sq&&sq)q.sq=sq;
      // 同じ名前で同じ背番号（どちらもある）なら同じ子として1人に。名前だけ同じなら別の子として残し、名簿の画面で「まとめる」を出す
      const same=pool.players.find(x=>x.name===q.name&&((x.id&&x.id===q.id)||(digits(x.number)!==''&&digits(x.number)===digits(q.number))));
      if(same){if(q.id&&q.id!==same.id)c.pidAlias[q.id]=same.id;if(!same.goal&&q.goal){same.goal=q.goal;same.gupd=q.gupd;}

// まとめたあとのID（何回まとめても最後のIDまでたどる）
function rp(pid){if(!pid)return '';let x=pid,n=0;for(;n<20;n++){let nx=null;for(const c of CLUBS){if(c.pidAlias&&c.pidAlias[x]){nx=c.pidAlias[x];break;}}if(!nx)break;x=nx;}return x;}
// 試合のその側の区分（Aチームなど）
function squadOf(g,t){const v=g&&g.sq&&g.sq[t];if(v)return String(v);const id=g&&g.rt&&g.rt[t];if(!id)return '';for(const c of CLUBS)if(c.oldTeams&&c.oldTeams[id]!=null)return c.oldTeams[id];return '';}
const poolOf=id=>{const f=findTeam(id);return f?f.t.id:'';};
const clubsOut=L=>L.map(c=>Object.assign({id:c.id},c.sample?{sample:true}:{},rosterOut(c)));
// 選手ID：一度付けたら変えない。試合の記録（打順・交代）はこのIDで選手とつなぐ
function newPid(used){let id;do{id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}while(used&&used.has(id));if(used)used.add(id);return id;}
function ensureIds(L){const seen=new Set();let ch=false;
  L.forEach(c=>c.teams.forEach(t=>t.players.forEach(p=>{if(!p.id||seen.has(p.id)){p.id=newPid(seen);ch=true;}else seen.add(p.id);})));return ch;}
let ROSTER_V=0;
function normClubs(d){
  if(d&&Array.isArray(d.clubs))return d.clubs.map((c,i)=>normClub(c,'c'+(i+1))).filter(Boolean);
  const one=normClub(d,'c1');return one&&(one.clubName||one.teams.length)?[one]:[];
}
function loadRoster(){
  let ok=false,mig=false;try{const v=JSON.parse(localStorage.getItem(CKEY)||'null');if(v&&Array.isArray(v.clubs)){mig=v.clubs.some(c=>!Array.isArray(c.teams)||c.teams.length!==1||String((c.teams[0]||{}).name||'').trim());CLUBS=normClubs(v);ok=true;}}catch(e){}
  if(!ok){try{CLUBS=normClubs(JSON.parse(localStorage.getItem(RKEY)||'null'));}catch(e){CLUBS=[];}}   // 以前の1クラブ形式から引き継ぐ
  if(ensureIds(CLUBS)||mig||!ok)saveRoster(CLUBS);   // IDのない選手・チームごとの名簿（古い版）を、クラブ単位にして保存
  ROSTER_V++;
}
function saveRoster(L){ensureIds(L);const data=clubsOut(L),txt=JSON.stringify({v:1,clubs:data});
  try{localStorage.setItem(CKEY,txt);if(localStorage.getItem(CKEY)!==txt)return false;}catch(e){return false;}CLUBS=normClubs({clubs:data});ROSTER_V++;return true;}
const clubPlayers=c=>c.teams.reduce((b,t)=>b+t.players.filter(p=>p.name).length,0);
const rosterCount=()=>CLUBS.reduce((a,c)=>a+clubPlayers(c),0);

// 名前は退団した選手も探す（在籍の選手を優先）。背番号は在籍の選手だけ（番号は新しい選手に引き継がれるため）
function rosterFind(teamId,name,no){const t=rTeam(teamId);if(!t)return null;const nm=String(name||'').trim(),n=digits(no);
  if(nm){const a=t.players.filter(p=>p.name&&(p.name===nm||p.nick===nm));return a.find(p=>!p.left&&p.name===nm)||a.find(p=>!p.left)||a.find(p=>p.name===nm)||a[0]||null;}

    [0,1].forEach(x=>{if(poolOf(g.rt[x])!==poolId)return;const k=(g.date||'')+'|'+String(g.created||0).padStart(15,'0');if(!best||k>best.k)best={k,g,x};});}

// 試合の記録からわかる背番号の移りかわり（古い順）

function stampAll(){let ch=[];Object.keys(games).forEach(id=>{if(stampGame(games[id]))ch.push(id);});return ch;}

const OPP_MARK='【相手チーム】';

function rosterCSV(R){
  const rows=[['チーム','背番号','名前（姓）','別名（下の名前など）']];
  R.teams.forEach(t=>t.players.filter(p=>p.name).forEach(p=>rows.push([p.sq||t.name||'',p.number||'',p.name,p.nick||''])));
  (R.opponents||[]).forEach(o=>rows.push([OPP_MARK,'',o,'']));
  return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
function rosterFileName(c){const d=new Date();return '名簿_'+(c.clubName||'チーム')+'_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.csv';}
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function rosterFromCSV(text,fileName){
  const rows=parseCSV(text.replace(/^﻿/,''));if(!rows.length)return null;
  // columns are found by their headings, so a sheet edited in Excel with columns moved still reads
  let col={team:0,number:1,name:2,nick:3},start=0;const h=rows[0].map(x=>String(x).trim());
  if(h.some(x=>/名前|背番号/.test(x))){start=1;const f=re=>h.findIndex(x=>re.test(x));
    col={team:f(/チーム/),number:f(/背番号|番号/),name:f(/名前|氏名/),nick:f(/別名|下の名前/)};if(col.name<0)return null;}
  const get=(r,k)=>col[k]>=0?String(r[col[k]]==null?'':r[col[k]]).trim():'';
  const R={clubName:'',aliases:[],opponents:[],teams:[]},byName={};
  rows.slice(start).forEach(r=>{const team=get(r,'team'),name=get(r,'name');if(!name)return;
    if(team===OPP_MARK){if(R.opponents.indexOf(name)<0)R.opponents.push(name);return;}
    let t=byName[team];if(!t){t={id:'t'+(R.teams.length+1),name:team,players:[]};byName[team]=t;R.teams.push(t);}
    t.players.push({number:digits(get(r,'number')),name,nick:get(r,'nick')});});
  const m=/^名簿_(.+)_\d{8}(?:\s*\(\d+\))?\.csv$/i.exec(String(fileName||''));if(m&&m[1]!=='チーム')R.clubName=m[1];
  return R;
}
// 名簿を合わせる：同じクラブ（id か名前）・同じチーム（id か名前）・同じ選手（id か同じチームの同じ名前）は、
// 端末にある方（cur）を優先して残す。新しいクラブ・チーム・選手だけ足す。どちらにも消すものはない。
function mergeClubs(cur,inc){
  const out=normClubs({clubs:clubsOut(cur)}),seen=new Set();out.forEach(c=>c.teams.forEach(t=>t.players.forEach(p=>{if(p.id)seen.add(p.id);})));let added=0;
  const fresh=p=>{const q=Object.assign({},p);if(!q.id||seen.has(q.id))q.id=newPid(seen);else seen.add(q.id);added++;return q;};
  inc.forEach(ic=>{let c=out.find(x=>x.id===ic.id&&!!x.sample===!!ic.sample)||(ic.clubName&&out.find(x=>x.clubName===ic.clubName));
    if(!c){c=normClub(Object.assign({},ic,{teams:[]}),out.some(x=>x.id===ic.id)?uid('c'):ic.id);out.push(c);}
    ic.opponents.forEach(o=>{if(c.opponents.indexOf(o)<0)c.opponents.push(o);});
    (ic.squads||[]).forEach(o=>{if(c.squads.indexOf(o)<0)c.squads.push(o);});Object.keys(ic.oldTeams||{}).forEach(k=>{if(c.oldTeams[k]==null)c.oldTeams[k]=ic.oldTeams[k];});
    Object.keys(ic.pidAlias||{}).forEach(k=>{if(!c.pidAlias[k])c.pidAlias[k]=ic.pidAlias[k];});
    if(c.teams.length&&ic.teams.length&&c.teams[0].id!==ic.teams[0].id&&c.oldTeams[ic.teams[0].id]==null)c.oldTeams[ic.teams[0].id]='';
    ic.teams.forEach(it=>{let t=c.teams.find(x=>x.id===it.id)||c.teams.find(x=>x.name===it.name);
      if(!t){t={id:c.teams.some(x=>x.id===it.id)?uid('t'):it.id,name:it.name,players:[]};c.teams.push(t);}
      it.players.forEach(ip=>{if(!ip.name)return;const q=(ip.id&&t.players.find(x=>x.id===ip.id))||t.players.find(x=>x.name===ip.name);
        if(!q)t.players.push(fresh(ip));});});});
  return {clubs:out,added};
}
// CSV（IDなし）を1つのクラブに反映：同じチームの同じ名前の選手はIDを残して背番号・別名を更新、新しい選手は追加、CSVにない選手は消さない
function applyCSV(c,r){let up=0,add=0;const seen=new Set();ui.rd.forEach(x=>x.teams.forEach(t=>t.players.forEach(p=>{if(p.id)seen.add(p.id);})));
  if(!c.teams.length)c.teams=[{id:uid('t'),name:'',players:[]}];const t=c.teams[0];
  r.teams.forEach(it=>{const sq=String(it.name||'').trim();if(sq&&c.squads.indexOf(sq)<0)c.squads.push(sq);
    it.players.forEach(ip=>{const q=t.players.find(x=>x.name===ip.name);
      if(q){if(q.number!==ip.number||(ip.nick&&q.nick!==ip.nick)){if(q.number!==ip.number)c.numAt=Date.now();q.number=ip.number;if(ip.nick)q.nick=ip.nick;up++;}if(sq)q.sq=sq;}
      else{t.players.push({id:newPid(seen),number:ip.number,name:ip.name,nick:ip.nick,sq,left:false,goal:'',gupd:0});add++;}});});
  r.opponents.forEach(o=>{if(c.opponents.indexOf(o)<0)c.opponents.push(o);});if(r.clubName&&!c.clubName)c.clubName=r.clubName;
  return {up,add};}
// 試合の記録がある選手ID（打順・交代のpid、pidのない古い試合は名前で当てた分も）。今の課題がある選手も含める
function usedPids(){const s=new Set();
  Object.keys(games).forEach(id=>{const g=games[id];if(!g)return;
    (g.lu||[]).forEach(L=>(L||[]).forEach(p=>{if(p&&p.pid)s.add(rp(p.pid));}));
    (g.ev||[]).forEach(e=>{if(e&&e.pid)s.add(rp(e.pid));});
    const L=gameLines(id);if(L)L.forEach(x=>{x.bat.forEach(b=>{if(b.pid)s.add(b.pid);});x.pit.forEach(b=>{if(b.pid)s.add(b.pid);});});});
  CLUBS.forEach(c=>c.teams.forEach(t=>t.players.forEach(p=>{if(p.goal||(p.goalLog&&p.goalLog.length))s.add(p.id);})));
  return s;}
function decodeText(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){}
  try{return new TextDecoder('shift_jis').decode(buf);}catch(e){return new TextDecoder().decode(buf);}}
function readRosterFile(file){
  if(!file)return;const fr=new FileReader();fr.onerror=()=>toast('ファイルを読めませんでした');
  fr.onload=()=>{
    const text=decodeText(fr.result).replace(/^﻿/,'');let r=null,all=null;
    if(/^\s*[{[]/.test(text)){let d=null;try{d=JSON.parse(text);}catch(e){}if(d&&d.app==='TapScore'&&d.roster)d=d.roster;
      if(d&&Array.isArray(d.clubs))all=normClubs(d);else r=normRoster(d);}
    else r=rosterFromCSV(text,file.name);
    const D=ui.rd;
    if(all&&all.length){const m=mergeClubs(D,all);ui.rd=m.clubs;ui.rdDirty=true;render();
      toast(m.added?m.added+'人を追加しました（今の名簿にいる選手はそのまま）。確認して「名簿を保存」を押してください':'読み込んだ名簿の選手は、すべて入っていました');return;}
    if(!r||!r.teams.length){toast('名簿のファイルとして読めませんでした（「チーム,背番号,名前（姓）,別名」の列があるCSVを選んでください）');return;}
    const n=r.teams.reduce((a,t)=>a+t.players.length,0),what=r.teams.length+'チーム・'+n+'人'+(r.opponents.length?'・対戦相手'+r.opponents.length+'件':'');
    const cur=D.find(c=>c.id===ui.rdClub);
    const same=r.clubName?D.find(c=>c.clubName===r.clubName||c.aliases.indexOf(r.clubName)>=0):null;
    const fillInto=c=>{ // 置きかえない：同じ名前の選手はIDを残して更新、新しい選手だけ追加、CSVにない選手は消さない
      const k=applyCSV(c,r);ui.rdClub=c.id;ui.rdTeam=(c.teams.find(x=>x.name===(r.teams[0]||{}).name)||c.teams[0]||{}).id||'';ui.rdDirty=true;render();
      toast('「'+(c.clubName||'クラブ名なし')+'」に読み込みました（追加'+k.add+'人・更新'+k.up+'人。CSVにない選手は残しています）。確認して「名簿を保存」を押してください');};
    const addNew=()=>{const c=Object.assign(normClub({},uid('c')),{clubName:r.clubName});D.push(c);fillInto(c);};
    if(same)fillInto(same);
    else if(cur&&!cur.clubName&&!clubPlayers(cur))fillInto(cur);
    else if(r.clubName)addNew();
    else{ui.conf={msg:'ファイル名からクラブ名がわかりませんでした。読み込んだ名簿（'+what+'）を、表示中の「'+((cur&&cur.clubName)||'クラブ名なし')+'」に入れますか？（同じ名前の選手は更新、新しい選手は追加。いまの選手は消しません）',yes:'このクラブに入れる',no:'新しいクラブとして追加',fn(){fillInto(cur);},nofn:addNew};openSheet('confirm');}
  };
  fr.readAsArrayBuffer(file);
}

function navApply(r,i){ui.mode='idle';ui.pend=null;ui.luDraft=null;ui.luFrom='';ui.luFix=false;ui.cq=null;ui.ret=null;closeSheet();
  if(ui.view==='roster'&&!(r&&r.view==='roster')){ui.rd=null;ui.rdDirty=false;}

function runOpts(S,from){const o=[];let k=from+1;for(;k<=3;k++){if(S.bases[k])break;o.push(k);}if(k>3)o.push(4);o.push(0);return o;}
function fixRs(){const r=ui.rs,o=runOpts(ui.S,r.from);if(r.to===-1&&r.why)return;if(!o.includes(r.to))r.to=o[0];
  const outK=r.k==='CS'||r.k==='PO';if(r.to===0&&!outK)r.k='CS';if(r.to!==0&&outK)r.k='SB';}
function openRun(from,to){
  const S=ui.S;if(!canInput())return;const occ=[1,2,3].filter(k=>S.bases[k]);if(!occ.length)return;
  if(!from||!S.bases[from])from=occ[occ.length-1];
  ui.rs={from,to:to==null?-1:to,k:'SB'};
  // ドラッグした先へ進めないとき（前の塁に走者がいる）は、別の塁やアウトに置きかえず、未選択にして理由を出す
  if(to!=null&&!runOpts(S,from).includes(to)){const blk=[1,2,3].find(k=>k>from&&k<to&&S.bases[k]);ui.rs.to=-1;
    ui.rs.why=(to>=4?'本塁':to+'塁')+'へは進めません'+(blk?'（'+blk+'塁に走者がいます）':'')+'。前の走者を先に動かすか、行き先を選んでください。';}
  fixRs();openSheet('run');
}
// 走者の行き先が場面によって変わりやすいときだけ確認する（それ以外は標準の進塁で確定し、「直す」で訂正できる）
function askRunners(res,B,outs){
  const b1=!!B[1],b23=!!(B[2]||B[3]);
  if(res==='E')return true;
  if(!b1&&!b23)return false;
  if(res==='1B'||res==='2B')return true;              // ヒットでは走者が2つ以上進むことがある
  if(res==='GO'||res==='FC'||res==='DP')return b23;
  if((res==='FO'||res==='LO')&&outs<2)return b23;     // タッチアップ（生還なら犠牲フライ）
  return false;
}
function pendLabel(p){return p.dp?({DP:'ゴロの併殺打',LO:'ライナーの併殺',FO:'フライの併殺'}[p.res]||'併殺'):RES[p.res].l;}
function afterPlace(){
  const S=ui.S,d=defaults(ui.pend.res,S.bases);ui.pend.b=d.b;ui.pend.r=d.r;ui.mode='idle';
  // ライナー・フライの併殺：戻れなかった走者をアウトにする（走者が2人以上なら確認画面で選び直せる）
  if(ui.pend.dp&&ui.pend.res!=='DP'){const occ=[1,2,3].filter(k=>S.bases[k]);if(occ.length)ui.pend.r[occ[occ.length-1]]=0;
    if(occ.length>1){render();openSheet('adv');}else commitBip();return;}
  if(askRunners(ui.pend.res,S.bases,S.outs)){render();openSheet('adv');}else commitBip();
}
function commitBip(){
  const p=ui.pend;if(!p)return;
  // フライ・ライナーで三塁走者がタッチアップして生還したら犠牲フライにする
  if((p.res==='FO'||p.res==='LO')&&p.b===0&&p.r&&p.r[3]===4&&ui.S.outs<2)p.res='SF';
  const e={t:'bip',res:p.res,b:p.b};if(p.q)e.q=1;
  if(p.f)e.f=p.f;if(p.x!=null){e.x=Math.round(p.x);e.y=Math.round(p.y);}
  if(p.r&&Object.keys(p.r).length)e.r=p.r;
  ui.pend=null;ui.mode='idle';closeSheet();pushEv(e);
}
function saveLineup(){
  const g=games[ui.gid],d=ui.luDraft;if(!g||!d)return;const t=d.t,used={};
  for(const r of d.rows){if(r.p>=1&&r.p<=10){if(used[r.p]){toast('守備位置「'+POS[r.p]+'」が2人います');return;}used[r.p]=1;}}
  const seenN={},seenNo={};for(const r of d.rows){const n=String(r.n||'').trim(),no=digits(r.no);
    if(n){if(seenN[n]){toast(n+'が打順に2回入っています');return;}seenN[n]=1;}if(no){if(seenNo[no]){toast('背番号'+no+'が2人います');return;}seenNo[no]=1;}}
  const sp=String(d.sp||'').trim().slice(0,20),dh=!d.rows.some(r=>r.p===1);
  const rows=d.rows.map(r=>{const o={n:String(r.n||'').trim().slice(0,20),p:r.p|0,no:digits(r.no).slice(0,3)};if(r.pid&&o.n)o.pid=String(r.pid);return o;});
  g.teams=[ui.S.teams[0],ui.S.teams[1]];g.teams[t]=(String(d.name||'').trim()||g.teams[t]).slice(0,20);
  if(d.fix){
    const L=[0,1].map(x=>((g.lu&&g.lu[x]&&g.lu[x].length)?g.lu[x]:defaultLineup()).map(p=>{const o={n:String(p.n||''),p:p.p|0,no:String(p.no||'')};if(p.pid)o.pid=String(p.pid);return o;}));
    L[t]=rows;g.lu=L;g.sp=[(g.sp&&g.sp[0])||'',(g.sp&&g.sp[1])||''];g.sp[t]=dh?sp:'';
    g.upd=Date.now();ui.luDraft=null;toast(save(ui.gid)?'スタメンを直しました。記録と成績も直しました':'この端末に保存できていません。自動でやり直しています');render();numberOffer(rows);return;
  }
  if(!(g.ev||[]).length){g.lu=[ui.S.lu[0],ui.S.lu[1]];g.lu[t]=rows;g.sp=[(g.sp&&g.sp[0])||'',(g.sp&&g.sp[1])||''];g.sp[t]=dh?sp:'';}
  else{const cur=ui.S.lu[t],subs=[];for(let i=cur.length;i>rows.length;i--)subs.push({t:'drop',tm:t,i:i-1});const wp=o=>{if(o.pid)o.pid=String(o.pid);else delete o.pid;return o;};
    rows.forEach((r,i)=>{if(!cur[i])subs.push(wp({t:'add',tm:t,n:r.n,p:r.p,no:r.no,pid:r.pid}));else if(cur[i].n!==r.n||cur[i].p!==r.p||(cur[i].no||'')!==r.no||(cur[i].pid||'')!==(r.pid||''))subs.push(wp({t:'sub',tm:t,i,n:r.n,p:r.p,no:r.no,pid:r.pid}));});
    if(dh&&sp&&sp!==ui.S.pit[t])subs.push({t:'pc',tm:t,n:sp});
    if(ui.ins!=null){g.ev=g.ev.slice();g.ev.splice(ui.ins,0,...subs);ui.ins+=subs.length;ui.insN=(ui.insN||0)+subs.length;}else g.ev=g.ev.concat(subs);}
  const live=(g.ev||[]).length>0;g.upd=Date.now();ui.luDraft=null;ui.redo=[];const ok=save(ui.gid);
  if(live&&ui.luFrom==='score'){ui.luFrom='';ui.tab='score';}
  toast(!ok?'この端末に保存できていません。自動でやり直しています':live?'交代を記録しました':'打順を保存しました');render();numberOffer(rows);
}

const md=s=>{const m=/^\d{4}-(\d{2})-(\d{2})$/.exec(s||'');return m?(+m[1])+'/'+(+m[2]):'';};
function goalPeriods(p){const L=(p.goalLog||[]).slice().sort((a,b)=>a.from-b.from).map(x=>({text:x.text,from:ymd(x.from),to:ymd(x.to),cur:false}));

const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

  {k:'ppp',l:'1打席あたりの投球数',f:'n1',num:g=>g.pitches,den:g=>g.ppa,unit:'打席',n:g=>g.ppa,d:'1打席で投げさせた球数。粘れているか。1球ずつ記録した試合だけ',pitch:true},
  {k:'avg',l:'打率',f:'r3',num:g=>g.h,den:g=>g.ab,unit:'打数',n:g=>g.ab,d:'少ない打数では偶然の差が大きい数字です'}];
const TRP=[
  {k:'fps',l:'初球ストライク率',f:'pct',num:g=>g.fps,den:g=>g.fn,unit:'人',n:g=>g.fn,d:'投球を記録した打者のうち、初球がストライク（見逃し・空振り・ファウル・打球）だった割合',pitch:true},
  {k:'bbr',l:'四死球率',f:'pct',num:g=>g.bb,den:g=>g.bf,unit:'人',n:g=>g.bf,d:'対戦した打者のうち四死球の割合（低いほど良い）',low:true},
  {k:'b3',l:'3ボールになった打者の割合',f:'pct',num:g=>g.b3,den:g=>g.fn,unit:'人',n:g=>g.fn,d:'3ボールまでいった打者の割合（低いほど良い）。1球ずつ記録した試合だけ',low:true,pitch:true}];
const fmtV=(v,f)=>!isFinite(v)?'-':f==='pct'?Math.round(v*100)+'%':f==='n1'?v.toFixed(1):v.toFixed(3).replace(/^0/,'');
function batSeries(pid){const by=new Map();
  playerPAs(pid).slice().reverse().forEach(a=>{let g=by.get(a.gid);if(!g){g={gid:a.gid,date:a.date,opp:a.opp,pa:0,ab:0,h:0,bb:0,sf:0,k:0,ppa:0,pitches:0,swings:0,whiffs:0};by.set(a.gid,g);}
    g.pa++;if(a.kind!=='BB'&&a.kind!=='SAC')g.ab++;if(a.kind==='H')g.h++;if(a.kind==='BB')g.bb++;if(a.sf)g.sf++;if(a.kind==='K')g.k++;
    if(a.pitched){g.ppa++;g.pitches+=a.pitches;g.swings+=a.swings;g.whiffs+=a.whiffs;}});
  return [...by.values()].sort((x,y)=>String(x.date).localeCompare(String(y.date)));}
function pitSeries(pid){const by=new Map();
  pitcherData(pid).faced.forEach(a=>{let g=by.get(a.gid);if(!g){g={gid:a.gid,date:a.date,opp:a.opp,bf:0,bb:0,fn:0,fps:0,b3:0};by.set(a.gid,g);}
    g.bf++;if(/四球|死球/.test(a.text))g.bb++;if(a.n>0){g.fn++;if(/[CSFX]/.test(a.first))g.fps++;if(a.b>=3||/四球/.test(a.text))g.b3++;}});
  return [...by.values()].sort((x,y)=>String(x.date).localeCompare(String(y.date)));}
// 各試合の値と、直近3試合（その試合を含む）の値
function trendPoints(G,m){return G.map((g,i)=>{const w=G.slice(Math.max(0,i-2),i+1),dn=m.den(g),wn=w.reduce((a,x)=>a+m.den(x),0);
  return {g,v:dn?m.num(g)/dn:NaN,n:m.n(g),r:wn?w.reduce((a,x)=>a+m.num(x),0)/wn:NaN,rn:w.reduce((a,x)=>a+m.n(x),0),rg:w.length};}).filter(x=>m.pitch?x.n>0:true);}
function trendHTML(kind,pid,goals){
  const defs=kind==='bat'?TRB:TRP,G=kind==='bat'?batSeries(pid):pitSeries(pid),key=kind==='bat'?'trB':'trP';
  const avail=defs.filter(m=>trendPoints(G,m).filter(x=>isFinite(x.v)).length>=1);if(!avail.length)return '';
  if(!avail.some(m=>m.k===ui[key]))ui[key]=avail[0].k;const m=avail.find(x=>x.k===ui[key]),P=trendPoints(G,m);
  let h='<div class="trend" data-kind="'+kind+'"><div class="chips">'+avail.map(x=>'<button class="chip'+(x===m?' on':'')+'" data-act="tr-m" data-kind="'+kind+'" data-v="'+x.k+'" aria-pressed="'+(x===m)+'">'+x.l+'</button>').join('')+'</div>';
  if(P.length<2)return h+'<p class="hint">'+esc(m.d)+'。2試合以上になると推移が見えます。</p></div>';
  const W=340,H=170,l=40,r=14,t=18,b=24,iw=W-l-r,ih=H-t-b;
  const vals=P.flatMap(x=>[x.v,x.r]).filter(isFinite),top=m.f==='n1'?Math.max(4,Math.ceil(Math.max(...vals)+0.5)):Math.min(1,Math.max(0.5,Math.ceil(Math.max(...vals)*4+0.2)/4));
  const X=i=>l+(P.length===1?iw/2:i*iw/(P.length-1)),Y=v=>t+ih-(Math.max(0,Math.min(top,v))/top)*ih;
  let svg='<svg class="trsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(m.l)+'の推移。'+P.length+'試合。最新の試合 '+fmtV(P[P.length-1].v,m.f)+'、直近3試合 '+fmtV(P[P.length-1].r,m.f)+'">';
  [0,top/2,top].forEach(v=>{svg+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmtV(v,m.f)+'</text>';});
  // 課題の開始日：その日以降の最初の試合の左に縦線
  (goals||[]).forEach(gp=>{const i=P.findIndex(x=>x.g.date>=gp.from);if(i<0)return;const x=i===0?l:(X(i-1)+X(i))/2;
    svg+='<line class="gline" x1="'+x+'" x2="'+x+'" y1="'+(t-6)+'" y2="'+(t+ih)+'"/><text class="glab" x="'+(x+3)+'" y="'+(t-6)+'">'+gmark(gp.n)+'</text>';});
  const step=Math.max(1,Math.ceil(P.length/6));P.forEach((x,i)=>{if(i%step===0||i===P.length-1)svg+='<text class="ax" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+md(x.g.date)+'</text>';});
  const pts=P.map((x,i)=>isFinite(x.r)?X(i).toFixed(1)+','+Y(x.r).toFixed(1):null).filter(Boolean);
  if(pts.length>1)svg+='<polyline class="rline" points="'+pts.join(' ')+'"/>';
  P.forEach((x,i)=>{if(isFinite(x.v))svg+='<circle class="gdot" cx="'+X(i)+'" cy="'+Y(x.v)+'" r="4"/>';});
  const sel=Math.min(ui[key+'i']!=null?ui[key+'i']:P.length-1,P.length-1);
  svg+='<line class="sel" x1="'+X(sel)+'" x2="'+X(sel)+'" y1="'+t+'" y2="'+(t+ih)+'"/>';
  P.forEach((x,i)=>{const w=P.length===1?iw:iw/(P.length-1);svg+='<rect class="hit" data-act="tr-pt" data-kind="'+kind+'" data-i="'+i+'" x="'+(X(i)-w/2)+'" y="0" width="'+w+'" height="'+H+'"/>';});
  svg+='</svg>';
  const s=P[sel];
  h+=svg+'<p class="trread"><b>'+md(s.g.date)+' 対'+esc(s.g.opp)+'</b>　'+m.l+' '+fmtV(s.v,m.f)+'（'+s.n+m.unit+'）　直近'+s.rg+'試合 <b>'+fmtV(s.r,m.f)+'</b>（'+s.rn+m.unit+'）</p>'+
    '<p class="hint">点：その試合　線：直近3試合をまとめた値'+((goals||[]).length?'　縦線：課題に取り組み始めた日':'')+'。'+esc(m.d)+'。</p></div>';
  return h;
}
/* ---------- AIに相談：数字はアプリが計算し、AIはそれを読み解くだけ ---------- */
// 球の順番から、結果の球の前のカウントと、追い込まれたか・初球を振ったかを出す
function paCount(seq){let b=0,s=0,two=false;const q=String(seq||'').split('');
  q.slice(0,-1).forEach(c=>{if(c==='B')b++;else if(c==='C'||c==='S')s++;else if(c==='F'&&s<2)s++;if(s>=2)two=true;});
  const last=q[q.length-1];if((last==='C'||last==='S')&&s>=2)two=true;
  return {b,s,two,first:q[0]||'',n:q.length};}
const RUNNERS={'':'走者なし','1':'一塁','2':'二塁','3':'三塁','12':'一・二塁','13':'一・三塁','23':'二・三塁','123':'満塁'};
// その選手の全打席（新しい試合から）
function playerPAs(pid){const out=[];
  Object.keys(games).forEach(id=>{const LL=gameLines(id);if(!LL)return;
    LL.filter(sqOK).forEach(L=>{const seenI={},tt={};L.pas.forEach(a=>{const lead=!seenI[a.inn];seenI[a.inn]=1;const kk=a.pit+'|'+a.pid;tt[kk]=(tt[kk]||0)+1;if(a.pid!==pid)return;const k=paCount(a.seq);
      const kind=/三振/.test(a.text)?'K':a.hit?'H':/四球|死球/.test(a.text)?'BB':/犠/.test(a.text)?'SAC':/失策|野選/.test(a.text)?'ROE':'OUT';
      out.push({gid:id,date:L.date,opp:L.opp,inn:a.inn,outs:a.o,runners:RUNNERS[a.on]||a.on,risp:/[23]/.test(a.on),seq:a.seq,pitched:L.hasPitch&&a.seq.length>0,
        count:k.b+'-'+k.s,two:k.two,first:k.first,pitches:k.n,result:a.text,kind,rbi:a.rbi,hr:a.res==='HR',xbh:['2B','3B','HR'].indexOf(a.res)>=0,
        sf:a.res==='SF',swings:(a.seq.match(/[SFX]/g)||[]).length,whiffs:(a.seq.match(/S/g)||[]).length,res:a.res,f:a.f,b:k.b,s:k.s,on:a.on,lead,tto:a.pit?tt[kk]:0});});});});
  out.sort((x,y)=>String(y.date).localeCompare(String(x.date))||y.inn-x.inn);return out;}
// 場面別の集計（打席数をかならず添える）
function splitLine(list){const ab=list.filter(a=>a.kind!=='BB'&&a.kind!=='SAC').length,h=list.filter(a=>a.kind==='H').length;

      let bb=null;if(b.length){bb={res:[]};BATK.forEach(k=>{bb[k]=b.reduce((a,x)=>a+(+x[k]||0),0);});bb.res=b.flatMap(x=>x.res);bb.order=b[0].order;}

function tourPlace(els){

  let L=1e9,T=1e9,R=-1e9,B=-1e9;els.forEach(e=>{const r=e.getBoundingClientRect();L=Math.min(L,r.left);T=Math.min(T,r.top);R=Math.max(R,r.right);B=Math.max(B,r.bottom);});

}

  svg.addEventListener('pointermove',ev=>{
    const d=ui.drag;if(!d)return;const pt=svgPt(svg,ev);d.pt=pt;
    if(d.type==='ft'){if(Math.hypot(pt.x-d.start.x,pt.y-d.start.y)>12)d.moved=true;return;}
    if(d.type==='r'){if(Math.hypot(pt.x-d.start.x,pt.y-d.start.y)>12)d.moved=true;if(!d.moved)return;}
    moveTok(d.g,pt);
  });
  svg.addEventListener('pointerup',()=>{
    const d=ui.drag;if(!d)return;ui.drag=null;
    if(d.type==='f'){ui.pend.f=d.f;ui.pend.x=d.pt.x;ui.pend.y=d.pt.y;afterPlace();return;}
    if(d.type==='ft'){if(!d.moved){ui.pend={pre:1,res:null,q:quickMode(games[ui.gid])?1:0,f:d.f,x:FP[d.f][0],y:FP[d.f][1],b:0,r:{}};openSheet('res');}return;}
    let to=null;
    if(d.moved){let best=44;[2,3,4].forEach(k=>{if(k<=d.from)return;const q=Math.hypot(BP[k][0]-d.pt.x,BP[k][1]-d.pt.y);if(q<best){best=q;to=k;}});}
    render();openRun(d.from,to);
  });
  svg.addEventListener('pointercancel',()=>{if(ui.drag){ui.drag=null;render();}});
}

/* ---------- start ---------- */
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({gid:ui.gid,tab:ui.tab}));
function start(d){if(d&&d.gid){ui.gid=d.gid;ui.tab=d.tab||'score';}boot();}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
</script>
